services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hippocrates
      POSTGRES_PASSWORD: hippocrates
      POSTGRES_DB: hippocrates
    ports:
      - "5432:5432"
    volumes:
      - hippocrates_pg:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  hippocrates_pg:
