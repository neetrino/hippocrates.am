# Pre-merge CI for Hippocrates.
# Require the "CI passed" check in GitHub branch protection.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  repo-guard:
    name: Repository guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Repository guards
        run: node scripts/ci/repo-guard.mjs

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      # 127.0.0.1 avoids the runner resolving localhost to IPv6 while Postgres listens on IPv4.
      DATABASE_URL: postgresql://hippocrates:hippocrates@127.0.0.1:5432/hippocrates
      DIRECT_URL: postgresql://hippocrates:hippocrates@127.0.0.1:5432/hippocrates
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hippocrates
          POSTGRES_PASSWORD: hippocrates
          POSTGRES_DB: hippocrates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hippocrates -d hippocrates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/^SESSION_SECRET=""/SESSION_SECRET="ci-session-secret-at-least-32-chars"/' .env
          sed -i 's/@localhost:5432/@127.0.0.1:5432/' .env

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm --filter @hippocrates/api db:generate

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Informational until Prisma transitive highs are resolved upstream.
      - name: Audit dependencies (high+)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Audit dependencies (critical)
        run: pnpm audit --audit-level=critical

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Private repos without Advanced Security skip this gate instead of failing merge.
      - name: Review dependency changes
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - name: Dependency review availability
        run: |
          if [ "${{ steps.review.outcome }}" = "failure" ]; then
            echo "Dependency review reported issues or is unavailable on this repository plan."
            echo "Treat actionable advisories before merge; do not ignore known high/critical findings."
          fi

  e2e:
    name: Critical journey
    runs-on: ubuntu-latest
    env:
      # Throwaway Postgres on this runner. The suite refuses any other host.
      DATABASE_URL: postgresql://hippocrates:hippocrates@127.0.0.1:5432/hippocrates
      DIRECT_URL: postgresql://hippocrates:hippocrates@127.0.0.1:5432/hippocrates
      E2E_DATABASE: loopback
      SESSION_SECRET: ci-e2e-session-secret-at-least-32-chars
      SEED_PASSWORD: Ci-E2e-Only-2026
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hippocrates
          POSTGRES_PASSWORD: hippocrates
          POSTGRES_DB: hippocrates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hippocrates -d hippocrates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hippocrates/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @hippocrates/api exec prisma migrate deploy

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser journey
        run: pnpm e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results
            playwright-report
          retention-days: 7

  ci-passed:
    name: CI passed
    if: always()
    needs: [repo-guard, quality, audit, dependency-review, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "repo-guard: ${{ needs.repo-guard.result }}"
          echo "quality: ${{ needs.quality.result }}"
          echo "audit: ${{ needs.audit.result }}"
          echo "dependency-review: ${{ needs.dependency-review.result }}"
          echo "e2e: ${{ needs.e2e.result }}"

          if [ "${{ needs.repo-guard.result }}" != "success" ]; then
            echo "Repository guard failed"
            exit 1
          fi
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "Quality checks failed"
            exit 1
          fi
          if [ "${{ needs.audit.result }}" != "success" ]; then
            echo "Security audit job failed (critical findings or setup error)"
            exit 1
          fi

          # dependency-review is skipped on push; soft on private plans without GHAS.
          if [ "${{ needs.dependency-review.result }}" = "failure" ]; then
            echo "Dependency review job failed unexpectedly"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Critical journey failed"
            exit 1
          fi

          echo "All required merge checks passed"
