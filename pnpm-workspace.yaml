packages:
  - "apps/*"
overrides:
  deepmerge-ts: 8.0.0
  handlebars: 4.7.10
  mysql2: 3.23.1
  source-map-js: 1.2.2
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.2'
  - '@nestjs/core@12.1.2'
  - '@nestjs/platform-express@12.1.2'
